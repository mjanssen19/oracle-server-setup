# /etc/ssh/sshd_config.d/99-hardening.conf
# From numbersgamearm01. Validate with `sudo sshd -t` BEFORE `sudo systemctl reload ssh`,
# and keep a second session open. Tailscale SSH does not use sshd; this hardens the fallback path.

# === Auth ===
PermitRootLogin no
# the one admin account
AllowUsers ubuntu
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
HostbasedAuthentication no
IgnoreRhosts yes
PermitUserEnvironment no
AuthenticationMethods publickey
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20s

# === Session hygiene ===
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no
Compression no
StrictModes yes

# === Features not used ===
AllowAgentForwarding no
# VS Code Remote-SSH / `ssh -L` need this set to yes. Change it deliberately and note why in the log.
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
X11Forwarding no

# === Logging ===
# logs the key fingerprint for each login
LogLevel VERBOSE
UseDNS no

# === Host keys: ed25519 + RSA only (delete /etc/ssh/ssh_host_ecdsa_key*) ===
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key

# === Crypto: modern only, with post-quantum KEX ===
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
