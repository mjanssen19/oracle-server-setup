# /etc/systemd/journald.conf.d/99-persistent.conf — persistent, size-capped journal. Apply: sudo systemctl restart systemd-journald
# WARNING: the restart immediately deletes entries older than MaxRetentionSec or beyond SystemMaxUse. Export first if needed.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M
MaxRetentionSec=1month
Compress=yes
ForwardToSyslog=no
